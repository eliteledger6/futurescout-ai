# Companies the Market agent checks in SEC EDGAR filings, grouped by sector (keys from sectors.yaml).
#
# Only US-listed companies that file with the SEC can be read here. CIK numbers are NOT stored:
# they are looked up at run time from the SEC's company_tickers.json, and a ticker the SEC file
# does not contain is reported as an error (never guessed). A research run reads only the companies
# of the topic's sector (plus whatever the SEC full-text discovery finds); the Company Scout treats
# every company on this list as an "incumbent" and ranks the others as emerging candidates.
#
# Foreign filers (TSM, ASML, ASX, HIMX...) report on Form 20-F. Companies that do not file with the SEC
# (SK hynix, Samsung, most Japanese/European/Chinese names) are deliberately absent.
#
# Edit freely: add or remove rows. `segment` is a plain description shown to the model.

