# Topic funds: one PAPER fund per research topic (SIMULATION: no money moves, nothing is traded).
# Stage 1 = paper trades at real closing prices; stage 2 = real NEAR Intents (1Click) DRY-RUN quotes for holdings
# that have a tokenized version (dry quotes reserve nothing and send nothing). Owner decision 2026-11-09.

start_cash_usd: 10000
benchmark: SPY                 # broad-market comparison for every fund

# Risk tiers by company size (SEC XBRL revenue size class) and their share of the invested money.
tiers:
  low:    {label: "Low risk: large companies",          weight: 0.60, size_classes: [large]}
  medium: {label: "Medium risk: mid-size companies",    weight: 0.30, size_classes: [mid]}
  high:   {label: "High risk: small companies",         weight: 0.10, size_classes: [small, micro]}
max_holdings_per_tier: 4

# Decision agent (code rules; every reason is written to the decision log and sealed on NEAR testnet).
# Target share of the fund invested, by the report's verdict band (app/report/verdict.py):
fully_invested: true           # owner 2026-11-10: every paper fund invests all its money (no cash held back)
unknown_size_tier: high       # a listed company without revenue data counts as high risk
exposure_by_band:
  strong: 1.00
  building: 0.75
  early: 0.40
  weak: 0.10
  insufficient: 0.00
full_confidence_pct: 70        # confidence needed for the band's full share; below it the share shrinks in proportion
score_drop_points: 8           # score fell this much vs the last decision -> halve the target ("signal weakening")
stretched_stage_factor: 0.5    # a tier whose stocks look stretched (timing risk high) invests only this share now
min_trade_share: 0.02          # ignore rebalancing trades smaller than 2% of the fund (avoid churn)
review_days: 7                 # with a staged entry still open, review again after this many days
fee_pct: 0.30                  # ASSUMED cost per trade (swap fee + slippage), close to the real 1Click dry quotes

# Stage 2: NEAR Intents 1Click dry-run quotes (public API, no key, nothing is sent). Tokenized stocks (Ondo, on BNB
# Chain) are found in the bridge token list and price-checked with a $100 dry quote (see app/fund/intents.py).
intents:
  api: https://1click.chaindefuser.com
  pay_asset: "nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1"   # USDC on NEAR
  pay_decimals: 6
  quote_account: intents.near  # placeholder recipient required by the quote format; dry quotes send nothing
  price_tolerance_pct: 15      # a token only counts as a stock's tokenized version if its price is this close

# Stage 3: small REAL trades (owner go-ahead 2026-11-09: about 10 USD + 0.5 NEAR in a dedicated mainnet account).
# Nothing can be sent while trading_enabled is false. Only `python scripts\fund_trade.py approve <id>` sends money.
# These caps are the owner's; Claude must not raise them without the owner saying so in writing.
live:
  trading_enabled: true       # master switch; the owner turns it on for the first trade
  route: confidential          # owner 2026-11-09: trade like near.com (signed order from the private balance); "wallet" = old route
  auto_approve: true          # OWNER-ONLY (set true by the owner 2026-11-10): true = a live proposal from `fund_trade.py watch` is sent without the typed approval.
  sells_enabled: true        # OWNER-ONLY. true = the agent may SELL (part of) a holding for NEAR (owner's written yes 2026-11-10)
  budget_mode: net          # OWNER-ONLY. spent = max_total_usd counts every dollar ever spent on buys;
                              #             net   = it counts buys MINUS sale proceeds (sale money can be invested again)
  max_sells_per_day: 2
  strategy:                    # when the trading agent wakes up, and its fixed rules (app/fund/strategy.py)
    check_minutes: 60          # `python scripts\fund_trade.py check --shadow --loop` looks this often
    review_hours: 24           # routine review even when nothing moved
    drop_pct: 7.0              # one-day fall that wakes the agent ("check the reason")
    jump_pct: 10.0             # one-day rise that wakes the agent (never chase)
    min_confidence_pct: 0      # owner 2026-11-11: no fixed minimum, the agent weighs each report's confidence itself (was 45)
    max_adds_per_ticker: 2     # buying a dip at most twice per company
    max_ticker_share_pct: 25.0 # shadow mode: one company at most this share of the budget
    price_requests_per_check: 6
    min_hold_hours: 0          # owner 2026-11-10: "remove the 24hrs limitation" (no minimum holding time)
    min_sell_fraction: 0.25    # smallest share of a holding the agent may sell
  order_recipients: [intents.near, intents.far]   # verifiers an order may be addressed to; intents.far = the private shard's contract (first real order, 2026-11-10)
  signed_route_enabled: true  # SECOND switch for that route. Built, not yet run for real. Only the owner turns it on.
  pay_with: near               # owner 2026-11-09: pay with NEAR directly (no USDC needed); "usdc" also works
  budget_from_balance: true    # OWNER-ONLY. owner 2026-11-12: "Agent can use whatever money inside his wallet": no dollar cap; a buy uses
                               #   what the near.com balance holds above private_reserve_near. The three caps below are then not applied.
  max_trade_usd: 60.0          # owner 2026-11-10: "remove 35usd per day the 25 per trade": set equal to the total cap, so only
  max_day_usd: 60.0            #   max_total_usd and the $20 near.com minimum limit a trade
  max_total_usd: 60       # the whole real-money budget, ever (owner 2026-11-09: per-trade cap 25 on top of the $10 already sent)
  min_trade_usd: 20.0          # near.com enforces a flat $20 minimum on stock trades (owner's screenshot 2026-11-09); the $10 test got stuck
  price_band_pct: 0            # owner 2026-11-11: no band in code; the agent sees quoted price vs last close and decides (was 3.0)
  band_per_stale_day_pct: 1.5  # +1.5% per extra day of age of that close (Friday's close on a Monday: 6%)
  max_band_pct: 8.0            # never wider than this
  max_cost_pct: 2.0            # refuse quotes that cost more than this
  slippage_bps: 100
  shadow_budget_usd: 10000.0   # pretend money for shadow mode (owner 2026-11-09: the agent may use all of it, sizes are its choice)

# Agent economy (owner 2026-11-10): the report agent (its own mainnet account) sells each report to the trading agent for
# NEAR, and stakes what it earns so the staking rewards pay for its NEAR AI usage (Staking for Inference).
economy:
  enabled: true                  # OWNER-ONLY switch: true = the trading agent pays real NEAR for reports
  seller_account: grandbread5023.near   # the report agent (owner's account, linked to NEAR AI Cloud)
  min_price_usd: 2.0              # owner 2026-11-10 (later): a report costs $2-3 depending on what it cost to make,
  max_price_usd: 3.0              #   paid in NEAR at the live price: full cost (models, X, patent searches, seal) + $1.50
  margin_usd: 1.50
  brief_usd: 0.5                  # owner 2026-11-12 ("$0.50 a day"): what the trading agent pays the report agent for one daily holding brief
  brief_hours: 24                 #   (X signals + a short risk note on each share it holds); one per holding this often; brief_usd 0 = off
  brief_max_posts: 10             # X posts read per brief (about half a cent each; 10 is the X API's minimum per search)
  brief_max_owed: 3               # no new brief while this many are unpaid
  max_price_near: 1.5             # safety limit on one report payment (about $5 at today's NEAR price)
  min_price_near: 0.5             # (unused while the dollar band is set)
  markup: 3.0                     # (older quality rule only)
  budget_share_of_fund: 0.30      # owner 2026-11-10: at most 30% of the live fund's value is spent on reports (was 10%)
  stake_share: 0.70               # owner 2026-11-10: stake 70% of each new payment, keep 30% in a pot
  second_trader_at_usd: 200       # owner 2026-11-10: when the kept pot passes $200 it funds a second trading agent (next step, not built)
  min_stake_near: 1.0             # NEAR AI (stake.dao) refuses less than 1 NEAR (min_lock_amount, seen 2026-11-10): stakes once 70% of payments reach 1 NEAR
  stake_reserve_near: 0.3         # left unstaked in the report agent's wallet for gas and NEAR seals
  market_open: true               # owner 2026-11-10: other trading bots may buy reports (/api/market)
  embargo_hours: null             # owner 2026-11-10: reports are never unlocked without payment (a number = free after N hours)
  demo_free_from: "2026-11-11T00:00:00+00:00"   # owner 2026-11-11: every report written from this day on is unlocked "for demo
                                  # purposes only" (the site says so); delete this line to sell new reports again
  always_free:                    # owner 2026-11-10: never locked, for the demo (high bandwidth memory, score 80)
    - e5d41d1f-fa56-42ce-bf27-9fccb47298a2
    - 4a2a3eaa-9841-4174-b38d-0a12e7b52623   # owner 2026-11-11: retrieval-augmented generation (first visitor proposal), free for the demo
  pay_from: private               # owner 2026-11-10: pay reports from the near.com (private) balance; "wallet" = plain transfer
  staking_contract: stake.dao     # NEAR AI's "Stake NEAR" contract, read from the owner's own dashboard stake (2026-11-10)
  stake_method: stake
  stake_args: {product_id: prod_33Kp14MGUJa2QA, price_id: price_QzmSvxbZqdbV0XbG6VD6KkbB}   # "NEAR AI Cloud Credits" / "Staking Farm"
  stake_gas_tgas: 300             # validator nearai.pool.near; rate "100 NEAR x 1 month = $1 credit"

# NEAR Agent Market (owner 2026-11-10): the report agent takes paid research jobs at market.near.ai (scripts\market_agent.py).
# The price per job and the delivery window are set by the owner on the listing page, not here.
# Topic proposals from website visitors (owner 2026-11-11): free, limited, screened by an AI reviewer before any research run.
proposals:
  enabled: true
  per_day: 5                      # proposals accepted a day, and research runs started from them a day
  reuse_hours: 168                # a report this recent on the topic is linked instead of a new run
  agent_market_url: https://market.near.ai/a/futurescout

agent_market:
  new_runs_per_day: 3             # new research runs a day (each costs about $0.30-0.50 of NEAR AI credit); others are declined and refunded
  reuse_hours: 168                # a sealed report this recent on the same topic is delivered instead of a new run
  poll_seconds: 60
  auto_top_n: 5                   # the report agent keeps a fresh report on each of the radar's top 5 topics...
  auto_fresh_days: 7              #   ...fresh = written in the last 7 days
  auto_runs_per_day: 2            # reports it writes by itself a day at most (top 5 + one for every report sold); 0 = off. About $0.35-0.45 each.
  topic_scout_hours: 1            # with no job waiting, the Science agent (same model as in a research run) reads a few recent papers this often
  topic_scout_papers: 5           #   and may add ONE new topic to the radar, if paper counts confirm it is growing; 0 hours = off
  topic_scout_max_per_day: 3      # new radar topics a day at most
  radar_refresh_hours: 24         # the report agent recounts the Hot-Topic Radar this often, in the background (free; over an hour at EPO's pace); 0 = off
